<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainware University Dashboard - Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-university {
            background-image: url('images/university-building.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .overlay {
            background-color: rgba(0, 0, 0, 0.6);
        }
        
        .card-shadow {
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="bg-university">
    <div class="min-h-screen overlay flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <div class="text-center">
                <h1 class="text-3xl font-bold text-white">Brainware University Dashboard</h1>
                <p class="mt-2 text-sm text-gray-200">Sign in to your account</p>
            </div>
            
            <div class="mt-8 bg-white bg-opacity-95 py-8 px-4 shadow-lg sm:rounded-lg sm:px-10 card-shadow">
                <form id="loginForm" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                        <div class="mt-1">
                            <input id="email" name="email" type="email" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>
                    
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                        <div class="mt-1">
                            <input id="password" name="password" type="password" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>
                    
                    <div>
                        <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            Sign In
                        </button>
                    </div>
                </form>
                
                <div class="mt-6">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-300"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-white text-gray-500">Or</span>
                        </div>
                    </div>
                    
                    <div class="mt-4">
                        <button id="registerBtn" class="w-full flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            Create New Account
                        </button>
                    </div>
                </div>
                
                <div id="errorMessage" class="mt-4 text-sm text-red-600 hidden"></div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <!-- Custom Scripts -->
    <script src="js/firebase-init.js"></script>
    <script>
        // DOM elements
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const registerBtn = document.getElementById('registerBtn');
        const errorMessage = document.getElementById('errorMessage');
        
        // Check for existing session instead of relying on Firebase auth state
        const storedUser = sessionStorage.getItem('currentUser');
        if (storedUser) {
            const userData = JSON.parse(storedUser);
            if (userData.role === 'teacher') {
                window.location.href = 'index.html';
            } else {
                window.location.href = 'student.html';
            }
        }
        
        // Create mock user data
        function createMockUser(user, role) {
            const mockUserData = {
                uid: user.uid,
                email: user.email,
                displayName: user.displayName || user.email.split('@')[0],
                role: role,
                classId: 'class1'
            };
            
            // Store mock user data
            sessionStorage.setItem('currentUser', JSON.stringify(mockUserData));
            
            // Redirect based on role
            if (role === 'teacher') {
                window.location.href = 'index.html';
            } else {
                window.location.href = 'student.html';
            }
        }
        
        // Login form submission
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            // Validate inputs
            if (!email) {
                showError('Please enter your email address');
                return;
            }
            
            if (!password) {
                showError('Please enter your password');
                return;
            }
            
            // Clear any previous error messages
            errorMessage.classList.add('hidden');
            
            // Sign in with email and password
            firebase.auth().signInWithEmailAndPassword(email, password)
                .then(userCredential => {
                    // Get user document to determine role
                    firebase.firestore().collection('users').doc(userCredential.user.uid).get()
                        .then(doc => {
                            if (doc.exists) {
                                const userData = doc.data();
                                // Store user data
                                sessionStorage.setItem('currentUser', JSON.stringify({
                                    uid: userCredential.user.uid,
                                    email: userCredential.user.email,
                                    displayName: userData.displayName || userCredential.user.displayName,
                                    role: userData.role,
                                    classId: userData.classId
                                }));
                                
                                // Redirect based on role
                                if (userData.role === 'teacher') {
                                    window.location.href = 'index.html';
                                } else {
                                    window.location.href = 'student.html';
                                }
                            } else {
                                // For hackathon: If doc doesn't exist, create a mock teacher
                                createMockUser(userCredential.user, 'teacher');
                            }
                        })
                        .catch(error => {
                            // For hackathon: On error, create a mock teacher user
                            console.error('Error fetching user data:', error);
                            createMockUser(userCredential.user, 'teacher');
                        });
                })
                .catch(error => {
                    // Provide more user-friendly error messages
                    let errorMsg = 'Authentication failed. Please try again.';
                    
                    if (error.code === 'auth/user-not-found') {
                        errorMsg = 'No account found with this email. Please check your email or register.';
                    } else if (error.code === 'auth/wrong-password') {
                        errorMsg = 'Incorrect password. Please try again.';
                    } else if (error.code === 'auth/invalid-email') {
                        errorMsg = 'Invalid email format. Please enter a valid email address.';
                    } else if (error.code === 'auth/too-many-requests') {
                        errorMsg = 'Too many unsuccessful login attempts. Please try again later.';
                    }
                    
                    showError(errorMsg);
                });
        });
        
        // Register button click
        registerBtn.addEventListener('click', () => {
            // For hackathon: Just redirect to register page
            window.location.href = 'register.html';
        });
        
        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
        }
    </script>
</body>
</html>
